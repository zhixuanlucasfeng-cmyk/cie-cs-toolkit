<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DryRun: a hard-coded answer scoring 1 out of 5">
  <rect width="1200" height="630" fill="#0e1116"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="64" y="56" width="34" height="34" rx="9" fill="#63d8bd"/>
    <text x="74" y="82" font-size="22" font-weight="700" fill="#07231d">D</text>
    <text x="112" y="82" font-size="24" font-weight="600" fill="#f2f5f7" font-family="Space Grotesk, system-ui, sans-serif">DryRun</text>
    <text x="216" y="82" font-size="16" fill="#8995a1">Computer Science Reasoning Lab</text>

    <text x="64" y="176" font-size="52" font-weight="600" fill="#f2f5f7" font-family="Space Grotesk, system-ui, sans-serif">Find where your reasoning breaks.</text>
    <text x="64" y="222" font-size="22" fill="#b8c1ca">Cambridge 0478 and 9618 &#183; pseudocode marked against hidden test cases</text>

    <rect x="64" y="272" width="520" height="292" rx="12" fill="#151a21" stroke="#303a45"/>
    <text x="88" y="308" font-size="14" fill="#8995a1">QUESTION &#183; output the larger of two numbers</text>
    <text x="88" y="348" font-size="19" fill="#f2f5f7">DECLARE a : INTEGER</text>
    <text x="88" y="378" font-size="19" fill="#f2f5f7">DECLARE b : INTEGER</text>
    <text x="88" y="408" font-size="19" fill="#f2f5f7">INPUT a</text>
    <text x="88" y="438" font-size="19" fill="#f2f5f7">INPUT b</text>
    <text x="88" y="468" font-size="19" fill="#ef6a6a">OUTPUT 58</text>
    <text x="88" y="524" font-size="15" fill="#8995a1">the worked example shows 58, so print 58</text>

    <rect x="616" y="272" width="520" height="292" rx="12" fill="#151a21" stroke="#303a45"/>
    <text x="640" y="308" font-size="14" fill="#8995a1">MARK BREAKDOWN</text>
    <text x="640" y="348" font-size="17" fill="#72d39f">&#10003;  Program runs without errors</text><text x="1090" y="348" font-size="17" fill="#f2f5f7">1/1</text>
    <text x="640" y="384" font-size="17" fill="#8995a1">&#9675;  Uses selection (IF or CASE)</text><text x="1090" y="384" font-size="17" fill="#8995a1">0/1</text>
    <text x="640" y="420" font-size="17" fill="#8995a1">&#9675;  Correct for typical values</text><text x="1090" y="420" font-size="17" fill="#8995a1">0/2</text>
    <text x="640" y="456" font-size="17" fill="#8995a1">&#9675;  Correct for edge cases</text><text x="1090" y="456" font-size="17" fill="#8995a1">0/1</text>
    <line x1="640" y1="482" x2="1112" y2="482" stroke="#303a45"/>
    <text x="640" y="522" font-size="19" fill="#b8c1ca">Total</text>
    <text x="1052" y="526" font-size="34" font-weight="600" fill="#ef6a6a" font-family="Space Grotesk, system-ui, sans-serif">1 / 5</text>

    <text x="64" y="600" font-size="15" fill="#8995a1">Independent learning resource &#8212; not endorsed by Cambridge International Education.</text>
  </g>
</svg>
